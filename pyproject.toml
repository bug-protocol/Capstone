[project]
name = "pharmasentry"
version = "0.1.0"
description = "PharmaSentry drug safety and medical information agent"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "strands-agents",
    "strands-agents-tools",
    "bedrock-agentcore",
    "chromadb==1.5.9",
    "sentence-transformers==5.7.0",
    "pymupdf",
    "pydantic",
    "python-dotenv",
    "requests",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"